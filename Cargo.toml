[package]
name = "parabole"
version = "0.2.0"
edition = "2024"
default-run = "parabole"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
glow = { version = "0.18", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libmpv2 = { version = "7.0.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "gzip", "rustls"] }
rfd = "0.18.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "unstable-winit-030", "renderer-femtovg", "compat-1-2", "unstable-fontique-011"], optional = true }
url = "2.5.8"
quick-xml = "0.41"
flate2 = "1"
arboard = { version = "3.7", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["embedded-mpv", "slint-ui"]
embedded-mpv = ["dep:libmpv2", "dep:glow"]
slint-ui = ["embedded-mpv", "dep:slint", "dep:slint-build", "dep:arboard"]

[build-dependencies]
slint-build = { version = "1.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = "line-tables-only"   # faster builds; backtraces keep line numbers

[[bin]]
name = "parabole"
path = "src/main.rs"
required-features = ["slint-ui"]

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"   # shortcut: unstable API pinned to slint's exact version, bump together
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }

[[example]]
name = "vm_seed"
required-features = ["slint-ui"]
