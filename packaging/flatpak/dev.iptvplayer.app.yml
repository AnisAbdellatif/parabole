# Unverified: not built locally (needs flatpak-builder on Linux). Build: see packaging/README.md.
# shortcut: cargo runs with network access during the build (not Flathub-compliant, which needs vendored
# sources from flatpak-cargo-generator.py); fine for sideloaded builds, upgrade before a Flathub submission.
app-id: dev.iptvplayer.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: iptv-player
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # mpv, built here because the runtime ships no libmpv. Minimal ffmpeg + libass below it.
  - name: libass
    buildsystem: autotools
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --enable-gpl
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3

  - name: iptv-player
    buildsystem: simple
    build-options:
      build-args: [--share=network]
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/iptv-player /app/bin/iptv-player
      - install -Dm644 packaging/iptv-player.desktop /app/share/applications/dev.iptvplayer.app.desktop
      - install -Dm644 packaging/icon.png /app/share/icons/hicolor/1024x1024/apps/dev.iptvplayer.app.png
    sources:
      - type: dir
        path: ../..
        skip: [target, dist, .git]
